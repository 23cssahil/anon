<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pending Recharges</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --bg-dark: #0f0c29;
            --glass: rgba(255,255,255,0.08);
            --card-bg: rgba(255,255,255,0.95);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            color: #1e1b4b;
        }

        .status-box {
            background: #eff6ff;
            border-left: 4px solid var(--accent);
            padding: 15px 20px;
            border-radius: 0 10px 10px 0;
            font-size: 15px;
            color: #1e40af;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .error-box {
            background: #fef2f2;
            border-left: 4px solid var(--danger);
            color: #991b1b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }

        .user-name { font-weight: 600; color: #1e293b; }
        .user-email { font-size: 12px; color: #64748b; }
        .utr-badge { background: #f3e8ff; color: #6b21a8; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-family: monospace; font-size: 13px;}
        .amount-badge { font-weight: 700; color: #059669; }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-approve { background: var(--success); color: white; }
        .btn-approve:hover { background: #059669; }
        
        .btn-reject { background: #f1f5f9; color: #475569; margin-left: 5px; }
        .btn-reject:hover { background: #e2e8f0; color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        
        .empty-state i { font-size: 48px; color: #cbd5e1; margin-bottom: 15px; }

        .dashboard-link {
            display: inline-block;
            margin-top: 20px;
            color: #fff;
            text-decoration: none;
            background: var(--glass);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.2s;
        }
        
        .dashboard-link:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon"><i class="fas fa-shield-alt"></i></div>
            <h1>Admin Panel</h1>
        </div>

        <div class="card">
            <div id="status-box" class="status-box">
                <i class="fas fa-spinner fa-spin"></i> Loading pending requests...
            </div>

            <div style="overflow-x: auto;">
                <table id="requests-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>User Details</th>
                            <th>Amount Paid</th>
                            <th>UTR / Reference No.</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requests-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/" class="dashboard-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('userToken');
        const statusBox = document.getElementById('status-box');
        const reqTable = document.getElementById('requests-table');
        const tbody = document.getElementById('requests-body');

        if (!token) {
            showError('Aap logged in nahi hain. Pehle dashboard par jakar admin id se login karein.');
        } else {
            loadRequests();
        }

        function showError(msg) {
            statusBox.className = 'status-box error-box';
            statusBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> <strong>Access Denied:</strong><br><br>${msg}`;
            reqTable.style.display = 'none';
        }

        async function loadRequests() {
            try {
                const res = await fetch('/api/admin/recharges', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json().catch(()=>({}));

                if (res.status === 403) {
                    showError(data.error || 'Aapki email admin email nahi hai. server.js me adminEmails array check karein.');
                    return;
                }

                if (!res.ok) {
                    showError('Error loading data: ' + (data.error || 'Server error'));
                    return;
                }

                if (!Array.isArray(data) || data.length === 0) {
                    statusBox.className = 'status-box';
                    statusBox.innerHTML = '<i class="fas fa-check-circle"></i> Koi pending requests nahi hain.';
                    
                    reqTable.style.display = 'table';
                    tbody.innerHTML = `<tr><td colspan="5">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>All Caught Up!</h3>
                            <p>No users are waiting for balance approval.</p>
                        </div>
                    </td></tr>`;
                    return;
                }

                statusBox.className = 'status-box';
                statusBox.innerHTML = `<i class="fas fa-list"></i> <strong>${data.length} Pending Request(s)</strong> found. Verify in your bank app before approving.`;
                reqTable.style.display = 'table';
                tbody.innerHTML = '';

                data.forEach(req => {
                    const tr = document.createElement('tr');
                    const date = new Date(req.createdAt).toLocaleString();
                    const name = req.userId ? req.userId.name : 'Unknown';
                    const email = req.userId ? req.userId.email : 'Unknown';
                    
                    tr.innerHTML = `
                        <td>
                            <div class="user-name">${name}</div>
                            <div class="user-email">${email}</div>
                        </td>
                        <td class="amount-badge">₹${req.amount.toFixed(2)}</td>
                        <td><span class="utr-badge">${req.utr}</span></td>
                        <td><div style="font-size:12px;color:#64748b;">${date}</div></td>
                        <td>
                            <button class="btn btn-approve" onclick="approveReq('${req._id}', ${req.amount})">
                                <i class="fas fa-check"></i> Approve
                            </button>
                            <button class="btn btn-reject" onclick="rejectReq('${req._id}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                showError('Network error connecting to server.');
            }
        }

        async function approveReq(id, amount) {
            if (!confirm(`Are you sure you want to APPROVE this recharge?\n\nUser will instantly get ₹${amount} in their wallet.`)) return;
            try {
                const res = await fetch(`/api/admin/recharges/${id}/approve`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    alert('✅ Approved successfully. Balance added.');
                    loadRequests();
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (err) {
                alert('Network error');
            }
        }

        async function rejectReq(id) {
            if (!confirm('Are you sure you want to REJECT this UTR request? (Use this for fake UTRs)')) return;
            try {
                const res = await fetch(`/api/admin/recharges/${id}/reject`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    alert('🗑️ Request rejected.');
                    loadRequests();
                } else {
                    alert('❌ Error: ' + data.error);
                }
            } catch (err) {
                alert('Network error');
            }
        }
    </script>
</body>
</html>
