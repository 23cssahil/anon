<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Pending Recharges</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; }
        button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; transition: 0.2s; }
        .btn-approve { background: #10b981; color: white; margin-right: 5px; }
        .btn-approve:hover { background: #059669; }
        .btn-reject { background: #ef4444; color: white; }
        .btn-reject:hover { background: #dc2626; }
        .login-msg { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pending Recharge Requests</h1>
        <p id="status-msg">Loading...</p>
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Email</th>
                    <th>Amount</th>
                    <th>UTR</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="requests-body">
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('userToken');
        if (!token) {
            document.getElementById('status-msg').innerHTML = '<span class="login-msg">You must be logged in as admin to view this page. Go to <a href="/">Dashboard</a> and login first.</span>';
        } else {
            loadRequests();
        }

        async function loadRequests() {
            try {
                const res = await fetch('/api/admin/recharges', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 403) {
                    document.getElementById('status-msg').innerHTML = '<span class="login-msg">Access Denied. Your email is not set as an admin in server.js.</span>';
                    return;
                }

                const data = await res.json();
                const tbody = document.getElementById('requests-body');
                tbody.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('status-msg').innerText = 'No pending requests at the moment.';
                    return;
                }

                document.getElementById('status-msg').innerText = `Found ${data.length} pending requests.`;

                data.forEach(req => {
                    const tr = document.createElement('tr');
                    const date = new Date(req.createdAt).toLocaleString();
                    const name = req.userId ? req.userId.name : 'Unknown';
                    const email = req.userId ? req.userId.email : 'Unknown';
                    
                    tr.innerHTML = `
                        <td>${name}</td>
                        <td>${email}</td>
                        <td>₹${req.amount}</td>
                        <td><strong>${req.utr}</strong></td>
                        <td>${date}</td>
                        <td>
                            <button class="btn-approve" onclick="approveReq('${req._id}')">Approve</button>
                            <button class="btn-reject" onclick="rejectReq('${req._id}')">Reject</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                document.getElementById('status-msg').innerText = 'Error loading requests.';
            }
        }

        async function approveReq(id) {
            if (!confirm('Are you sure you want to APPROVE this recharge? Balance will be added to the user.')) return;
            try {
                const res = await fetch(`/api/admin/recharges/${id}/approve`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    alert('Approved successfully.');
                    loadRequests();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Network error');
            }
        }

        async function rejectReq(id) {
            if (!confirm('Are you sure you want to REJECT this recharge?')) return;
            try {
                const res = await fetch(`/api/admin/recharges/${id}/reject`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    alert('Rejected successfully.');
                    loadRequests();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Network error');
            }
        }
    </script>
</body>
</html>
